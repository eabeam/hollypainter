{{ define "main" }}

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="page-header-inner">
    <div class="page-breadcrumb anim-up">
      <a href="/">Home</a>
      <span class="sep">//</span>
      Research
    </div>
    <h1 class="page-title anim-up d1">Research</h1>
    {{ with .Params.intro }}
    <p class="page-intro anim-up d2">{{ . }}</p>
    {{ end }}
  </div>
</div>

<!-- RESEARCH PROJECTS -->
<section>
  <div class="section-inner">
    <div class="bento-grid">
      {{ range .Pages }}
      <a href="{{ .Permalink }}" class="bento-card" style="text-decoration:none;color:inherit;">
        <div class="bento-card-tag">Research Project</div>
        <h3>{{ .Title }}</h3>
        <p>{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 150 }}{{ end }}</p>
        <span class="arrow" style="position:absolute;bottom:2rem;right:2rem;font-size:1.2rem;color:var(--mid);transition:all 0.3s;">&#8599;</span>
      </a>
      {{ end }}
    </div>
  </div>
</section>

{{ end }}
