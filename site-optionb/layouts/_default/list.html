{{ define "main" }}
{{ partial "page-header.html" . }}

<section>
  <div class="section-inner">
    {{ with .Content }}
      <div class="description-block">
        {{ . }}
      </div>
    {{ end }}

    {{ if .Pages }}
      <div class="page-list">
        {{ range .Pages }}
          <div class="page-list-item">
            <a href="{{ .Permalink }}">{{ .Title }}</a>
          </div>
        {{ end }}
      </div>
    {{ end }}
  </div>
</section>
{{ end }}
