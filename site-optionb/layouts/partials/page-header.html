<div class="page-header">
  <div class="page-header-inner">
    <div class="page-breadcrumb">
      <a href="/">Home</a>
      <span class="sep">//</span>
      {{ with .Section }}
        {{ $sectionPage := site.GetPage "section" . }}
        {{ if $sectionPage }}
          <a href="{{ $sectionPage.Permalink }}">{{ $sectionPage.Title }}</a>
          <span class="sep">//</span>
        {{ end }}
      {{ end }}
      {{ .Title }}
    </div>
    {{ with .Params.role_tag }}
      <div class="page-role-tag">{{ . }}</div>
    {{ end }}
    <h1 class="page-title">{{ .Title }}</h1>
  </div>
</div>
