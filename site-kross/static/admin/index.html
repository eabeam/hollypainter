<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Content Manager</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      .cms-welcome {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(15, 93, 94, 0.12);
        border: 1px solid rgba(15, 93, 94, 0.25);
        color: #1f2a2e;
        font: 14px/1.3 serif;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
        pointer-events: none;
      }
      .cms-welcome svg {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
      }
      .cms-welcome span {
        display: block;
      }
      .cms-welcome small {
        display: block;
        font-size: 12px;
        opacity: 0.85;
      }
      @media (max-width: 700px) {
        .cms-welcome {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="cms-welcome" aria-hidden="true">
      <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img">
        <rect x="14" y="46" width="52" height="18" rx="9" fill="#d8e6e6"/>
        <circle cx="40" cy="34" r="20" fill="#f5fbfb" stroke="#0f5d5e" stroke-width="2"/>
        <circle cx="40" cy="34" r="12" fill="#bfe7e5"/>
        <circle cx="34" cy="32" r="3" fill="#0f5d5e"/>
        <circle cx="46" cy="32" r="3" fill="#0f5d5e"/>
        <path d="M34 38c4 3 8 3 12 0" stroke="#0f5d5e" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="24" cy="22" r="5" fill="#8ed3cf"/>
        <rect x="22" y="12" width="4" height="8" rx="2" fill="#8ed3cf"/>
        <circle cx="56" cy="22" r="5" fill="#8ed3cf"/>
        <rect x="54" y="12" width="4" height="8" rx="2" fill="#8ed3cf"/>
      </svg>
      <span>Welcome aboard.<small>Time to edit some poetry.</small></span>
    </div>
    <script src="https://unpkg.com/decap-cms@^3.0.12/dist/decap-cms.js"></script>
  </body>
</html>
