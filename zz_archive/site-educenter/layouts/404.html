{{ define "main" }}
<section class="section">

        <p class="text-muted text-uppercase small mb-2">404</p>
        <h1 class="mb-3">Page not found</h1>
        <p class="text-muted mb-4">The page you're looking for isn't here. Try one of these:</p>
        <div class="d-flex justify-content-center flex-wrap">
          <a class="btn btn-primary m-1" href="{{ "/" | relURL }}">Go home</a>
          <a class="btn btn-outline-primary m-1" href="{{ "/poetry/" | relURL }}">Browse poetry</a>
          <a class="btn btn-outline-primary m-1" href="{{ "/books/" | relURL }}">Browse books</a>

      </div>
    </div>
  </div>
</section>
